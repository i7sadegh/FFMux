name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply change script
        run: |
          if [ -f apply-changes.sh ]; then
            bash apply-changes.sh
          else
            echo "apply-changes.sh not present, skipping"
          fi

      - name: Commit applied changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply apply-changes.sh [skip ci]"
            git push
          else
            echo "nothing to commit"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK (arm64-v8a)
        run: gradle assembleRelease --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFMux-arm64-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Read app version
        id: appver
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.appver.outputs.version }}
          name: FFMux v${{ steps.appver.outputs.version }}
          files: app/build/outputs/apk/release/app-release.apk
